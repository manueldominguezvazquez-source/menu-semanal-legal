<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MenuPlan AI</title>
<style>
  :root { color-scheme: light dark; --bg: #fbf7f0; --fg: #2b2118; --soft: #6b5d50; --accent: #c8501e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1814; --fg: #f3ece2; --soft: #b5a998; --accent: #f08a57; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  main { max-width: 22rem; padding: 1.5rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: var(--soft); line-height: 1.5; margin: .5rem 0; }
  #code { display: block; font-size: 2rem; letter-spacing: .18em; font-weight: 600; color: var(--fg); margin: 1rem 0; }
  a.btn { display: block; padding: 1rem; border-radius: 1rem; background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; margin: 1rem 0; }
  a.play { color: var(--accent); }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p id="text"></p>
  <span id="code" hidden></span>
  <a id="open" class="btn" hidden></a>
  <a id="play" class="play"></a>
</main>
<script>
(function () {
  var PLAY_URL = 'https://play.google.com/store/apps/details?id=com.menusemanal.app';
  var COPY = {
    es: { title: 'Únete a un hogar en MenuPlan AI', ok: 'Abre la app: el código ya estará escrito. Solo te queda pulsar «Unirme».', other: 'Abre MenuPlan AI en tu móvil Android y escribe este código para unirte.', bad: 'Este enlace no es válido. Pide a tu hogar que te lo envíe de nuevo.', open: 'Abrir en MenuPlan AI', play: 'Instalar desde Google Play' },
    en: { title: 'Join a household in MenuPlan AI', ok: 'Open the app: the code will already be filled in. Just tap "Join".', other: 'Open MenuPlan AI on your Android phone and enter this code to join.', bad: 'This link is not valid. Ask your household to send it again.', open: 'Open in MenuPlan AI', play: 'Install from Google Play' },
    fr: { title: 'Rejoins un foyer dans MenuPlan AI', ok: 'Ouvre l’app : le code sera déjà saisi. Il ne te reste qu’à appuyer sur « Rejoindre ».', other: 'Ouvre MenuPlan AI sur ton téléphone Android et saisis ce code pour rejoindre le foyer.', bad: 'Ce lien n’est pas valide. Demande à ton foyer de te le renvoyer.', open: 'Ouvrir dans MenuPlan AI', play: 'Installer depuis Google Play' },
    de: { title: 'Tritt einem Haushalt in MenuPlan AI bei', ok: 'Öffne die App: Der Code ist schon eingetragen. Tippe nur noch auf „Beitreten“.', other: 'Öffne MenuPlan AI auf deinem Android-Handy und gib diesen Code ein, um beizutreten.', bad: 'Dieser Link ist ungültig. Bitte deinen Haushalt, ihn erneut zu senden.', open: 'In MenuPlan AI öffnen', play: 'Aus Google Play installieren' },
    it: { title: 'Unisciti a una casa in MenuPlan AI', ok: 'Apri l’app: il codice sarà già inserito. Ti basta toccare «Unisciti».', other: 'Apri MenuPlan AI sul tuo telefono Android e inserisci questo codice per unirti.', bad: 'Questo link non è valido. Chiedi alla tua casa di inviartelo di nuovo.', open: 'Apri in MenuPlan AI', play: 'Installa da Google Play' },
    pt: { title: 'Junta-te a um lar no MenuPlan AI', ok: 'Abre a app: o código já estará preenchido. Só tens de tocar em «Entrar».', other: 'Abre o MenuPlan AI no teu telemóvel Android e introduz este código para entrares.', bad: 'Esta ligação não é válida. Pede ao teu lar que a envie de novo.', open: 'Abrir no MenuPlan AI', play: 'Instalar a partir do Google Play' }
  };
  var lang = String(navigator.language || 'en').slice(0, 2).toLowerCase();
  var c = COPY[lang] || COPY.en;
  document.documentElement.lang = COPY[lang] ? lang : 'en';
  var raw = new URLSearchParams(location.search).get('c') || '';
  var code = raw.toUpperCase();
  var valid = /^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{8}$/.test(code);
  document.getElementById('title').textContent = c.title;
  var play = document.getElementById('play');
  play.textContent = c.play;
  play.href = PLAY_URL;
  // intent:// solo existe en Android: en iOS y en escritorio da error, así que ahí solo se enseña el código.
  var isAndroid = /android/i.test(navigator.userAgent || '');
  document.getElementById('text').textContent = !valid ? c.bad : (isAndroid ? c.ok : c.other);
  if (!valid) return;
  var codeEl = document.getElementById('code');
  codeEl.textContent = code;
  codeEl.hidden = false;
  if (!isAndroid) return;
  var intent = 'intent://join/' + code + '#Intent;scheme=menuplan;package=com.menusemanal.app;S.browser_fallback_url=' + encodeURIComponent(PLAY_URL) + ';end';
  var open = document.getElementById('open');
  open.textContent = c.open;
  open.href = intent;
  open.hidden = false;
  try { location.replace(intent); } catch (e) { /* el botón sirve de respaldo con gesto del usuario */ }
})();
</script>
</body>
</html>
